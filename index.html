<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zelo - Mocidade CCB</title>
    <meta name="description" content="Sistema de gestão e controle de frequência para Reunião de Jovens. Gerencie membros, registre reuniões e acompanhe estatísticas de presença.">
    <meta name="author" content="Reunião de Jovens" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var savedMode = localStorage.getItem("theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = savedMode === "dark" || (savedMode === "system" && prefersDark);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <style>
      :root {
        --loader-background: 42 24% 96%;
        --loader-foreground: 60 5% 15%;
        --loader-primary: 48 30% 34%;
        --loader-muted: 45 10% 82%;
      }

      html.dark {
        --loader-background: 75 5% 12%;
        --loader-foreground: 48 25% 91%;
        --loader-primary: 48 35% 77%;
        --loader-muted: 60 3% 30%;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      #app-loading-screen,
      .app-loading-surface {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: hsl(var(--loader-background));
        color: hsl(var(--loader-foreground));
      }

      .app-loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .app-loading-mark {
        position: relative;
        width: 124px;
        height: 124px;
      }

      .app-loading-mark-base,
      .app-loading-mark-fill {
        position: absolute;
        inset: 0;
        display: block;
        -webkit-mask: url("/logo-zelo-transparent.png") center / contain no-repeat;
        mask: url("/logo-zelo-transparent.png") center / contain no-repeat;
      }

      .app-loading-mark-base {
        background: hsl(var(--loader-muted));
        opacity: 0.42;
      }

      .app-loading-mark-fill {
        background: hsl(var(--loader-primary));
        clip-path: inset(100% 0 0 0);
        animation: initial-logo-fill 1.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }

      .app-loading-label {
        margin: 0;
        color: hsl(var(--loader-foreground) / 0.7);
        font: 600 12px/1.4 Poppins, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .app-loading-reload {
        border: 1px solid hsl(var(--loader-primary) / 0.35);
        border-radius: 10px;
        padding: 9px 14px;
        background: hsl(var(--loader-primary));
        color: hsl(var(--loader-background));
        font: 700 12px Poppins, ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }

      @keyframes initial-logo-fill {
        0% {
          clip-path: inset(100% 0 0 0);
          opacity: 0.75;
        }
        72%,
        92% {
          clip-path: inset(0 0 0 0);
          opacity: 1;
        }
        100% {
          clip-path: inset(0 0 0 0);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-mark-fill {
          animation-duration: 3.2s;
        }
      }
    </style>

    <!-- Preconnect to font domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Load fonts asynchronously to prevent render blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <!-- Fallback for browsers with JavaScript disabled -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/pwa-512.png">
  
  
  
  
  <meta property="og:title" content="Zelo - Mocidade CCB">
  <meta name="twitter:title" content="Zelo - Mocidade CCB">
  <meta property="og:description" content="Sistema de gestão e controle de frequência para Reunião de Jovens. Gerencie membros, registre reuniões e acompanhe estatísticas de presença.">
  <meta name="twitter:description" content="Sistema de gestão e controle de frequência para Reunião de Jovens. Gerencie membros, registre reuniões e acompanhe estatísticas de presença.">
</head>

  <body>
    <div id="app-loading-screen" aria-label="Carregando Zelo">
      <div class="app-loading-card">
        <div class="app-loading-mark" aria-hidden="true">
          <span class="app-loading-mark-base"></span>
          <span class="app-loading-mark-fill"></span>
        </div>
        <p class="app-loading-label">Carregando o Zelo</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var recoveryFlag = "zelo_recovered_from_stale_app";

        function isAppAssetError(event) {
          var target = event && event.target;
          var tag = target && target.tagName;
          var src = target && (target.src || target.href);
          var message = String((event && (event.message || event.reason)) || "");

          return (
            (src && (tag === "SCRIPT" || tag === "LINK")) ||
            /failed to fetch dynamically imported module|importing a module script failed|loading chunk|chunkloaderror|dynamically imported module/i.test(
              message,
            )
          );
        }

        function clearCachesAndReload() {
          if (sessionStorage.getItem(recoveryFlag) === "1") return;
          sessionStorage.setItem(recoveryFlag, "1");

          var clearServiceWorkers =
            "serviceWorker" in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(
                      regs.map(function (registration) {
                        return registration.unregister();
                      }),
                    );
                  })
              : Promise.resolve();

          var clearCaches =
            "caches" in window
              ? caches.keys().then(function (names) {
                  return Promise.all(
                    names.map(function (name) {
                      return caches.delete(name);
                    }),
                  );
                })
              : Promise.resolve();

          Promise.all([clearServiceWorkers, clearCaches]).finally(function () {
            window.location.reload();
          });
        }

        window.addEventListener(
          "error",
          function (event) {
            if (isAppAssetError(event)) clearCachesAndReload();
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          if (isAppAssetError(event)) clearCachesAndReload();
        });

        window.setTimeout(function () {
          var loader = document.getElementById("app-loading-screen");
          var root = document.getElementById("root");
          if (!loader || (root && root.children.length > 0)) return;

          loader.innerHTML =
            '<div class="app-loading-card">' +
            '<div class="app-loading-mark" aria-hidden="true"><span class="app-loading-mark-base"></span><span class="app-loading-mark-fill"></span></div>' +
            '<p class="app-loading-label">A atualização está demorando</p>' +
            '<button type="button" class="app-loading-reload">Recarregar</button>' +
            "</div>";

          var button = loader.querySelector("button");
          if (button) button.addEventListener("click", clearCachesAndReload);
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
